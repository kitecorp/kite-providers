name: Provider Distributions

# Builds every provider's distribution, starts each one the way the engine does and
# checks that it serves every resource type (kitecorp/kite-providers#22).
on:
  push:
    # Branches only: a release tag push runs the same check inside the release workflow
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: distribution-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution-test:
    # A pull request from this repository already ran on its push; only forks need this run
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Publish the provider SDK to Maven Local
        uses: ./.github/actions/publish-sdk-to-maven-local

      - name: Build every provider distribution
        id: build
        run: |
          set -euo pipefail
          DIRS=""
          for BUILD in */build.gradle; do
            PROVIDER="${BUILD%/build.gradle}"
            [[ "$(<"$BUILD")" == *"id 'cloud.kitelang.provider'"* ]] || continue
            # grpc-example and terraform-bridge build only inside the kite repo, against its
            # local SDK; every provider released from here has its own wrapper
            if [ ! -x "$PROVIDER/gradlew" ]; then
              echo "::notice::Not checked: $PROVIDER has no Gradle wrapper, so it builds only inside the kite repo"
              continue
            fi
            (cd "$PROVIDER" && ./gradlew installDist --no-daemon)
            DIST="$(dirname "$PROVIDER"/build/install/*/provider.json)"
            echo "Built $PROVIDER into $DIST"
            DIRS="${DIRS:+$DIRS,}$PWD/$DIST"
          done
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"

      - name: Start every distribution and check its resource types
        working-directory: distribution-test
        run: ./gradlew test -PdistributionDirs="${{ steps.build.outputs.dirs }}" --no-daemon
