name: Ask kitelang.cloud to rebuild
description: >-
  Waits until GitHub Pages has built this run's last push, then starts the deploy
  workflow of kitecorp/kitelang.cloud (deploy.yml on main) with the released
  providers as its providers input. That workflow builds the /providers/ pages
  from the docs on GitHub Pages, so it also waits until Pages serves the versions
  named here, then builds and deploys (kitecorp/kitelang.cloud#64). Run it after
  docs/providers.json is pushed, in a job with `pages: read`.

inputs:
  providers:
    description: Space-separated names of the providers this run released, for example "aws gcp".
    required: true
  token:
    description: >-
      A token that may start workflows in kitecorp/kitelang.cloud (fine-grained:
      Actions read and write, which cannot push code). When empty, nothing is
      started and the run shows a notice instead.
    required: true

runs:
  using: composite
  steps:
    - name: Start the kitelang.cloud deploy
      shell: bash
      env:
        PROVIDERS: ${{ inputs.providers }}
        SITE_TOKEN: ${{ inputs.token }}
        # Reads this repository's Pages builds and compares commits.
        GH_TOKEN: ${{ github.token }}
        # A Pages build takes about a minute.
        PAGES_TIMEOUT_SECONDS: 600
        PAGES_POLL_SECONDS: 15
      run: |
        set -euo pipefail
        # A missing secret must not fail a release that has already been published.
        if [ -z "$SITE_TOKEN" ]; then
          echo "::notice title=kitelang.cloud not rebuilt::The SITE_DISPATCH_TOKEN secret is not set, so kitelang.cloud was not asked to rebuild. Its /providers/ pages show this release after its next deploy."
          exit 0
        fi

        # The versions come from the docs/providers.json this run pushed: the site
        # reads each provider's version from that file, so it waits for these values.
        # Workflow inputs are strings, so the list goes in as JSON text.
        if ! BODY=$(jq -c --arg names "$PROVIDERS" '
          ($names | split(" ") | map(select(length > 0))) as $released
          | [.providers[] | select(.name | IN($released[])) | {name, version: .latestVersion}] as $entries
          | ($released - [$entries[].name]) as $missing
          | if ($released | length) == 0 then error("no provider names given")
            elif ($missing | length) > 0 then error("docs/providers.json has no entry for \($missing | join(", "))")
            else {ref: "main", inputs: {providers: ($entries | tojson)}}
            end
        ' "$GITHUB_WORKSPACE/docs/providers.json"); then
          echo "::error title=kitelang.cloud not rebuilt::Could not name the released versions from docs/providers.json (see the jq error above)."
          exit 1
        fi

        # Wait until Pages has built a commit that contains this run's last push.
        # The site cannot see this from the versions alone: re-releasing a version
        # pushes new docs under a version Pages already lists. And GitHub keeps only
        # one pending deploy run on the site, so a run that replaces the one started
        # here must find the docs already published.
        PUSHED=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
        DEADLINE=$(( $(date +%s) + PAGES_TIMEOUT_SECONDS ))
        while :; do
          BUILD=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.status + " " + .commit')
          read -r STATUS BUILT <<< "$BUILD"
          if [ "$STATUS" = built ]; then
            # "identical" or "ahead": the built commit is the push or comes after it.
            RELATION=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PUSHED...$BUILT" --jq .status)
            if [ "$RELATION" = identical ] || [ "$RELATION" = ahead ]; then
              echo "GitHub Pages has built $BUILT, which contains $PUSHED."
              break
            fi
          fi
          if [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "::error title=kitelang.cloud not rebuilt::GitHub Pages has not built $PUSHED after $PAGES_TIMEOUT_SECONDS seconds (latest build: $STATUS, $BUILT). See the pages-build-deployment runs of $GITHUB_REPOSITORY."
            exit 1
          fi
          echo "Waiting for GitHub Pages to build $PUSHED (latest build: $STATUS, $BUILT)"
          sleep "$PAGES_POLL_SECONDS"
        done

        echo "Starting the kitelang.cloud deploy: $BODY"
        RUN=$(GH_TOKEN="$SITE_TOKEN" gh api --method POST repos/kitecorp/kitelang.cloud/actions/workflows/deploy.yml/dispatches --input - <<< "$BODY")
        # The API answers with the new run's URL. An empty answer (204) also means it started.
        RUN_URL=$(jq -r '.html_url // empty' <<< "$RUN")
        echo "kitelang.cloud deploy started, it deploys once GitHub Pages serves these versions: ${RUN_URL:-https://github.com/kitecorp/kitelang.cloud/actions/workflows/deploy.yml}" | tee -a "$GITHUB_STEP_SUMMARY"
